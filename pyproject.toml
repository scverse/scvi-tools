[build-system]
build-backend = "hatchling.build"
requires = [ "hatchling" ]

[project]
name = "scvi-tools"
version = "1.5.0.post1"
description = "Deep probabilistic analysis of single-cell omics data."
readme = "README.md"
license = { file = "LICENSE" }
maintainers = [
  { name = "The scvi-tools development team", email = "ori.kronfeld@weizmann.ac.il" },
]
authors = [
  { name = "The scvi-tools development team" },
]
requires-python = ">=3.12"
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Natural Language :: English",
  "Operating System :: MacOS :: MacOS X",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
  "anndata",
  "docrep>=0.3.2",
  "joblib",
  "lightning>=2",
  "ml-collections",
  "mudata",
  "numba>=0.60",
  "numpy",
  "pandas",
  "pyro-ppl",
  "rich",
  "scanpy[skmisc]>=1.10",
  "scikit-learn",
  "scipy",
  "sparse>=0.14",
  "tensorboard",
  "torch",
  "torchmetrics",
  "tqdm",
  "xarray",
]
optional-dependencies.all = [ "scvi-tools[optional,tutorials]" ]
# scvi.autotune (TODO: New autotune not supported on Windows yet)
optional-dependencies.autotune = [
  "hyperopt>=0.2",
  "muon",
  "ray[tune]; sys_platform!='win32'",
  "scib-metrics",
  "setuptools>=77.0.3,<82",
]
optional-dependencies.cuda = [
  "cupy-cuda12x",
  "nvidia-nccl-cu12; sys_platform=='linux'",
  "torchaudio",
  "torchvision",
]
optional-dependencies.cuda13 = [
  "cupy-cuda13x",
  "nvidia-nccl-cu13; sys_platform=='linux'",
  "torchaudio",
  "torchvision",
]
# for custom dataloaders
optional-dependencies.dataloaders = [
  "annbatch[zarrs]>=0.2",
  "cellxgene-census",
  "lamindb>=1.12.1",
  "tiledbsoma",
  "tiledbsoma-ml",
  "torchdata",
]
# for diagvi
optional-dependencies.diagvi = [ "geomloss", "torch-geometric" ]
# for files sharing or handling
optional-dependencies.file-sharing = [ "fcswrite", "gdown", "pooch", "readfcs" ]
# scvi.hub dependencies
optional-dependencies.hub = [ "boto3", "dvc[s3]", "huggingface-hub", "requests" ]
# for models interpretability
optional-dependencies.interpretability = [ "captum", "decoupler", "shap" ]
optional-dependencies.metal = [ "mlx", "mlx-metal", "torchaudio", "torchvision" ]
# for mlflow
optional-dependencies.mlflow = [ "gputil", "mlflow>=3.9", "nvidia-ml-py", "psutil" ]
optional-dependencies.optional = [
  "igraph",
  "leidenalg",
  "pynndescent",
  "scvi-tools[autotune,diagvi,file-sharing,hub,interpretability,mlflow,parallel,regseq]",
]
# for parallelization engine
optional-dependencies.parallel = [ "dask[array]", "zarr" ]
# for rapids
optional-dependencies.rapids = [ "cupy", "rapids-singlecell[rapids]" ]
optional-dependencies.rapids-cuda12 = [
  "cugraph-cu12>=24",
  "cuml-cu12>=24",
  "cupy-cuda12x",
  "rapids-singlecell-cu12[rapids]",
]
optional-dependencies.rapids-cuda13 = [
  "cugraph-cu13>=24",
  "cuml-cu13>=24",
  "cupy-cuda13x",
  "rapids-singlecell-cu13[rapids]",
]
# scvi.data.add_dna_sequence
optional-dependencies.regseq = [ "biopython>=1.81", "genomepy" ]
optional-dependencies.tpu = [ "torch-xla[tpu]" ]
optional-dependencies.tutorials = [
  "biomart",
  "cell2location",
  "jupyter",
  "matplotlib",
  "plotnine",
  "scrublet",
  "scvi-tools[dataloaders,optional]",
  "seaborn",
  "squidpy>=1.6",
  "umap-learn>=0.5",
]
# https://docs.pypi.org/project_metadata/#project-urls
urls.Documentation = "https://docs.scvi-tools.org/"
urls.Homepage = "https://scvi-tools.org"
urls.Source = "https://github.com/scverse/scvi-tools"

[dependency-groups]
dev = [
  "jupyter",
  "prek",
  "twine>=4.0.2",
]
test = [
  "coverage>=7.10",
  "pytest",
  "pytest-cov",     # For VS Code’s coverage functionality
  "pytest-pretty",
]
doc = [
  "docutils>=0.8,!=0.18.*,!=0.19.*", # see https://github.com/scverse/cookiecutter-scverse/pull/205
  "ipykernel",
  "ipython",
  "myst-nb>=1.1",
  "myst-parser",
  "pandas",
  "sphinx>=8.1,<9",
  "sphinx-autodoc-typehints",
  "sphinx-book-theme>=1",
  "sphinx-copybutton",
  "sphinx-design",
  "sphinx-hoverxref",
  "sphinxcontrib-bibtex>=1",
  "sphinxext-opengraph",
]

[tool.hatch]
build.targets.wheel.packages = [ "src/scvi" ]
envs.default.installer = "uv"
envs.default.dependency-groups = [ "dev" ]
envs.docs.features = [ "autotune", "diagvi", "hub" ]
envs.docs.scripts.build = "sphinx-build -M html docs docs/_build -W {args}"
envs.docs.scripts.clean = "git clean -fdX -- {args:docs}"
envs.docs.scripts.open = "python -m webbrowser -t docs/_build/html/index.html"
envs.docs.dependency-groups = [ "doc" ]
envs.hatch-test.installer = "uv"
envs.hatch-test.features = [ "optional" ]
envs.hatch-test.matrix = [
  # Test every supported Python version with normal deps
  { deps = [ "stable" ], python = [ "3.12", "3.13", "3.14" ] },
  # Test the newest supported Python version also with pre-release deps
  { deps = [ "pre" ], python = [ "3.14" ] },
]
# If the matrix variable `deps` is set to "pre",
# set the environment variable `UV_PRERELEASE` to "allow".
envs.hatch-test.overrides.matrix.deps.env-vars = [
  { value = "allow", key = "UV_PRERELEASE", if = [ "pre" ] },
]
envs.hatch-test.dependency-groups = [ "dev", "test" ]
envs.test-cuda.template = "hatch-test"
envs.test-cuda.features = [ "cuda", "optional" ]
envs.test-metal.template = "hatch-test"
envs.test-metal.features = [ "metal", "optional" ]
envs.test-dataloaders.template = "hatch-test"
envs.test-dataloaders.features = [ "dataloaders", "optional" ]
envs.test-resolution.template = "hatch-test"
envs.test-resolution.features = [ "optional" ]
envs.test-resolution.env-vars.UV_PRERELEASE = "allow"

[tool.uv]
# uvloop does not support Windows; override the transitive dependency
# pulled in via flax -> orbax-checkpoint -> uvloop
override-dependencies = [
  "uvloop ; sys_platform != 'win32'",
]

[tool.ruff]
line-length = 99
src = [ "src" ]
extend-include = [ "*.ipynb" ]
format.docstring-code-format = true
lint.select = [
  "B",      # flake8-bugbear
  "BLE",    # flake8-blind-except
  "C4",     # flake8-comprehensions
  "D",      # pydocstyle
  "E",      # Error detected by Pycodestyle
  "F",      # Errors detected by Pyflakes
  "FA",     # flake8-future-annotations
  "I",      # isort
  "NPY",    # numpy-specific rules
  "PT",     # flake8-pytest-style
  "RUF100", # Report unused noqa directives
  "TC",     # flake8-type-checking
  "TID",    # flake8-tidy-imports
  "UP",     # pyupgrade
  "W",      # Warning detected by Pycodestyle
]
lint.ignore = [
  "B008",   # Errors from function calls in argument defaults. These are fine when the result is immutable.
  "D100",   # Missing docstring in public module
  "D104",   # Missing docstring in public package
  "D107",   # Missing docstring in __init__
  # Disable one in each pair of mutually incompatible rules
  "D203",   # We don’t want a blank line before a class docstring
  "D213",   # <> We want docstrings to start immediately after the opening triple quote
  "D400",   # first line should end with a period [Bug: doesn’t work with single-line docstrings]
  "D401",   # First line should be in imperative mood; try rephrasing
  "E501",   # line too long -> we accept long comment lines; formatter gets rid of long code lines
  "E731",   # Do not assign a lambda expression, use a def -> lambda expression assignments are convenient
  "E741",   # allow I, O, l as variable names -> I is the identity matrix
  "NPY002", # We support the legacy np.random functions
  "PT011",  # Raising ValueError is enough in tests
]
lint.per-file-ignores."*/__init__.py" = [ "F401" ]
lint.per-file-ignores."docs/*" = [ "BLE001", "I" ]
lint.per-file-ignores."src/scvi/__init__.py" = [ "I" ]
lint.per-file-ignores."tests/*" = [ "D" ]
lint.flake8-type-checking.exempt-modules = []
lint.flake8-type-checking.strict = true
lint.pydocstyle.convention = "numpy"

[tool.pytest]
ini_options.testpaths = [ "tests" ]
ini_options.addopts = [
  "--import-mode=importlib", # allow using test files with same name
  "-p",                      # hatch's test environments ship pytest-randomly; keep collection order deterministic
  "no:randomly",
]
ini_options.markers = [
  "autotune: mark tests that are used to check ray autotune capabilities",
  "custom dataloaders: mark tests that are used to check different custom data loaders",
  "dataloader: mark tests that are used to check data loaders",
  "internet: mark tests that requires internet access",
  "mlflow: mark test for mlflow",
  "multigpu: mark tests that are used to check multi GPU performance",
  "optional: mark optional tests, usually take more time",
  "private: mark tests that uses private keys, like HF",
]
ini_options.xfail_strict = true

[tool.coverage]
run.omit = [
  "**/test_*.py",
]
run.patch = [ "subprocess" ]
run.source = [ "scvi" ]

[tool.jupytext]
formats = "ipynb,md"

[tool.cruft]
skip = [
  ".git",
  ".github/ISSUE_TEMPLATE/release_checklist.md",
  ".github/pull_request_template.md",
  ".github/workflows",
  "CHANGELOG.md",
  "README.md",
  "docs",
  "src",
  "tests",
]
