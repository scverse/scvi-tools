name: Test (private)

on:
  pull_request:
    branches: [main, "[0-9]+.[0-9]+.x"]
    types: [labeled, synchronize, opened]
  schedule:
    - cron: "0 10 * * *" # runs at 10:00 UTC (03:00 PST) every day
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  HATCH_ENV: hatch-test.py3.13-stable

jobs:
  test:
    # if PR has label "private tests" or "all tests" or if scheduled or manually triggered or on push
    if: >-
      (
        contains(github.event.pull_request.labels.*.name, 'private tests') ||
        contains(github.event.pull_request.labels.*.name, 'all tests') ||
        (contains(github.event_name, 'schedule') && github.repository == 'scverse/scvi-tools') ||
        contains(github.event_name, 'workflow_dispatch') ||
        contains(github.event_name, 'push')
      )

    name: private
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write # for the AWS role assumption below

    defaults:
      run:
        shell: bash -e {0} # -e to fail on error

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          filter: blob:none
          fetch-depth: 0
          persist-credentials: false

      - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          audience: sts.amazonaws.com
          role-to-assume: arn:aws:iam::${{ secrets.AWS_IAM }}:role/scvi-tools_private_test
          aws-region: eu-west-1
          role-duration-seconds: 3600 # generous upper limit for the duration of the test

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.13"

      - name: Create hatch environment
        run: uvx hatch env create $HATCH_ENV

      - name: List all installed package versions
        run: uvx hatch run $HATCH_ENV:uv pip list

      - name: Run tests using hatch
        env:
          MPLBACKEND: agg
          PLATFORM: ubuntu-latest
          DISPLAY: :42
          COLUMNS: 120
          HF_API_TOKEN: ${{ secrets.HF_API_TOKEN }}
        run: uvx hatch run $HATCH_ENV:run-cov -v --color=yes --private

      - name: Generate coverage report
        run: |
          # See https://coverage.readthedocs.io/page/config.html#run-patch
          test -f .coverage || uvx hatch run $HATCH_ENV:cov-combine
          uvx hatch run $HATCH_ENV:cov-report   # report visibly
          uvx hatch run $HATCH_ENV:coverage xml # create report for upload

      - name: Upload coverage
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: private
