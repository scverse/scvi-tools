name: Release

# based off of https://github.com/astral-sh/ruff/blob/main/.github/workflows/release.yaml
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "The version to tag (without the leading 'v'). If omitted, will initiate a dry run (no uploads)."
        default: ""
        type: string
      branch:
        description: "The branch from which to release."
        type: string
      prerelease:
        description: "Whether the release is a pre-release."
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Use "trusted publishing", see https://docs.pypi.org/trusted-publishers/
permissions: {}

jobs:
  validate-tag:
    name: Validate tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # If you don't set an input tag, it's a dry run (no uploads).
    if: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          filter: blob:none
          fetch-depth: 0
          ref: ${{ inputs.branch }}
          persist-credentials: false

      - name: Check tag consistency
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          version=$(grep "^version = " pyproject.toml | sed -e 's/version = "\(.*\)"/\1/g')
          if [ "${INPUT_TAG}" != "${version}" ]; then
            echo "The input tag does not match the version from pyproject.toml:" >&2
            echo "${INPUT_TAG}" >&2
            echo "${version}" >&2
            exit 1
          else
            echo "Releasing ${version}"
          fi

  publish-release:
    name: Publish to GitHub
    runs-on: ubuntu-latest
    needs: validate-tag
    # If you don't set an input tag, it's a dry run (no uploads).
    if: ${{ inputs.tag }}
    permissions:
      # For creating the git tag and the GitHub release
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          filter: blob:none
          fetch-depth: 0
          ref: ${{ inputs.branch }}
          persist-credentials: false

      # `gh release create` also creates the tag, and fails if it already exists, so a repeated
      # release attempt stops before the PyPI upload.
      - name: Create the tag and the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_BRANCH: ${{ inputs.branch }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          prerelease_flag=""
          if [ "${INPUT_PRERELEASE}" = "true" ]; then
            prerelease_flag="--prerelease"
          fi
          gh release create "${INPUT_TAG}" \
            --target "${INPUT_BRANCH}" \
            --title "scvi-tools ${INPUT_TAG}" \
            --notes-file .github/workflows/release_notes.md \
            ${prerelease_flag}

  upload-release:
    name: Upload release to PyPI
    runs-on: ubuntu-latest
    needs: publish-release
    environment:
      name: pypi
      url: https://pypi.org/p/scvi-tools
    permissions:
      contents: read
      id-token: write # IMPORTANT: this permission is mandatory for trusted publishing
    # If you don't set an input tag, it's a dry run (no uploads).
    if: ${{ inputs.tag }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          filter: blob:none
          fetch-depth: 0
          ref: ${{ inputs.branch }}
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: false

      - name: Build package
        run: uv build

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # v1.14.1

  build-image:
    name: Build image
    runs-on: ubuntu-latest
    needs: publish-release

    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        dependencies: ["", "optional", "tutorials"]
    # If you don't set an input tag, it's a dry run (no uploads).
    if: ${{ inputs.tag }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          filter: blob:none
          fetch-depth: 0
          ref: ${{ inputs.branch }}
          persist-credentials: false

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c # v4.5.2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image suffix
        id: image
        env:
          INPUT_DEPENDENCIES: ${{ matrix.dependencies }}
        run: echo "suffix=${INPUT_DEPENDENCIES:-runtime}" >> $GITHUB_OUTPUT

      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          push: true
          cache-from: type=registry,ref=ghcr.io/scverse/scvi-tools:buildcache
          cache-to: type=inline,ref=ghcr.io/scverse/scvi-tools:buildcache
          target: build
          tags: ghcr.io/scverse/scvi-tools:py3.13-cu12-${{ inputs.tag }}-${{ steps.image.outputs.suffix }},ghcr.io/scverse/scvi-tools:py3.13-cu12-stable-${{ steps.image.outputs.suffix }}
          build-args: |
            DEPENDENCIES=${{ matrix.dependencies }}
