name: Test (MPS)

on:
  push:
    branches: [main, "[0-9]+.[0-9]+.x"]
  pull_request:
    branches: [main, "[0-9]+.[0-9]+.x"]
    types: [labeled, synchronize, opened]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  HATCH_ENV: test-metal
  HATCH_PYTHON: "3.13"

jobs:
  test:
    # if PR has label "mps" or "all tests" or if scheduled or manually triggered
    if: >-
      (
        contains(github.event.pull_request.labels.*.name, 'mps') ||
        contains(github.event.pull_request.labels.*.name, 'all tests') ||
        (contains(github.event_name, 'schedule') && github.repository == 'scverse/scvi-tools') ||
        contains(github.event_name, 'workflow_dispatch')
      )

    name: mps
    runs-on: [self-hosted, macOS, X64, MPS]

    defaults:
      run:
        shell: bash -e {0} # -e to fail on error

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          filter: blob:none
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2

      - name: Create hatch environment
        run: uvx hatch env create $HATCH_ENV

      - name: List all installed package versions
        run: uvx hatch run $HATCH_ENV:uv pip list

      - name: Run tests using hatch
        env:
          MPLBACKEND: agg
          PLATFORM: macos
          DISPLAY: :42
          COLUMNS: 120
          PYTORCH_MPS_HIGH_WATERMARK_RATIO: 0.0
          PYTORCH_ENABLE_MPS_FALLBACK: 1
        run: uvx hatch run $HATCH_ENV:run-cov -v --color=yes --accelerator mps --devices auto

      - name: Generate coverage report
        run: |
          # See https://coverage.readthedocs.io/page/config.html#run-patch
          test -f .coverage || uvx hatch run $HATCH_ENV:cov-combine
          uvx hatch run $HATCH_ENV:cov-report   # report visibly
          uvx hatch run $HATCH_ENV:coverage xml # create report for upload

      - name: Upload coverage
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: mps
