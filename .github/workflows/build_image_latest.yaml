name: Build image (latest)

on:
  push:
    branches: [main, "[0-9]+.[0-9]+.x"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash -e {0} # -e to fail on error

    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        dependencies: ["", "optional", "tutorials"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          filter: blob:none
          fetch-depth: 0
          persist-credentials: false

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set build inputs
        id: build
        env:
          INPUT_DEPENDENCIES: ${{ matrix.dependencies }}
          INPUT_REF: ${{ github.ref_name }}
        run: |
          echo "dependencies=${INPUT_DEPENDENCIES:-runtime}" >> $GITHUB_OUTPUT

          if [[ $INPUT_REF == "main" ]]; then
            VERSION="latest"
          else
            VERSION=${INPUT_REF}
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          push: true
          cache-from: type=registry,ref=ghcr.io/scverse/scvi-tools:buildcache
          cache-to: type=inline,ref=ghcr.io/scverse/scvi-tools:buildcache
          target: build
          tags: ghcr.io/scverse/scvi-tools:py3.13-cu12-${{ steps.build.outputs.version }}-${{ steps.build.outputs.dependencies }}
          build-args: |
            DEPENDENCIES=${{ matrix.dependencies }}
